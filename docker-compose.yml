# Local Development PostgreSQL 16 Environment
# NOTE: WHEREZIT_DEV_DB_PASSWORD must be supplied locally. Do not commit actual credentials.
# Production credentials are managed separately through Secret Manager / Cloud SQL.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wherezit_postgres_dev
    environment:
      POSTGRES_DB: wherezit_dev
      POSTGRES_USER: wherezit
      POSTGRES_PASSWORD: ${WHEREZIT_DEV_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wherezit -d wherezit_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
